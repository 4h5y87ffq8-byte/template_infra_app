name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: -Xmx3072m

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Run integration tests
      working-directory: ./app
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
        SPRING_DATASOURCE_USERNAME: testuser
        SPRING_DATASOURCE_PASSWORD: testpass
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379
      run: mvn verify -Pintegration-tests

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: app/target/surefire-reports/
        retention-days: 7

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start services
      run: docker-compose up -d

    - name: Wait for services
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:8080/actuator/health; do sleep 5; done'

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Create k6 test script
      run: |
        cat > performance-test.js << 'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export const options = {
          stages: [
            { duration: '1m', target: 50 },
            { duration: '3m', target: 50 },
            { duration: '1m', target: 100 },
            { duration: '3m', target: 100 },
            { duration: '1m', target: 0 },
          ],
          thresholds: {
            http_req_duration: ['p(95)<500', 'p(99)<1000'],
            http_req_failed: ['rate<0.01'],
          },
        };

        export default function () {
          const BASE_URL = 'http://localhost:8080';
          
          // Health check
          let res = http.get(`${BASE_URL}/actuator/health`);
          check(res, { 'health check status 200': (r) => r.status === 200 });
          
          // Get messages
          res = http.get(`${BASE_URL}/api/messages`);
          check(res, { 'get messages status 200': (r) => r.status === 200 });
          
          sleep(1);
        }
        EOF

    - name: Run performance tests
      run: k6 run --out json=performance-results.json performance-test.js
      continue-on-error: true

    - name: Upload performance results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-results.json
        retention-days: 7

    - name: Stop services
      if: always()
      run: docker-compose down

  dependency-update-check:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Check for Maven updates
      working-directory: ./app
      run: |
        mvn versions:display-dependency-updates > dependency-updates.txt
        mvn versions:display-plugin-updates >> dependency-updates.txt

    - name: Upload dependency report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-updates
        path: app/dependency-updates.txt
        retention-days: 7

    - name: Check for critical updates
      working-directory: ./app
      run: |
        if grep -i "major" dependency-updates.txt; then
          echo "⚠️ Major dependency updates available!"
        fi

  security-audit:
    name: Nightly Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Run OWASP Dependency Check
      working-directory: ./app
      run: mvn org.owasp:dependency-check-maven:check

    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: app/target/dependency-check-report.html
        retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [integration-tests, performance-tests, dependency-update-check, security-audit]
    if: always()
    
    steps:
    - name: Determine overall status
      id: status
      run: |
        if [ "${{ needs.integration-tests.result }}" == "success" ] && \
           [ "${{ needs.performance-tests.result }}" == "success" ] && \
           [ "${{ needs.security-audit.result }}" == "success" ]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "color=#36a64f" >> $GITHUB_OUTPUT
          echo "message=All nightly tests passed! ✅" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "color=#ff0000" >> $GITHUB_OUTPUT
          echo "message=Some nightly tests failed! ❌" >> $GITHUB_OUTPUT
        fi

    - name: Send Slack notification
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "${{ steps.status.outputs.message }}",
            "attachments": [
              {
                "color": "${{ steps.status.outputs.color }}",
                "fields": [
                  {
                    "title": "Integration Tests",
                    "value": "${{ needs.integration-tests.result }}",
                    "short": true
                  },
                  {
                    "title": "Performance Tests",
                    "value": "${{ needs.performance-tests.result }}",
                    "short": true
                  },
                  {
                    "title": "Security Audit",
                    "value": "${{ needs.security-audit.result }}",
                    "short": true
                  },
                  {
                    "title": "Dependency Check",
                    "value": "${{ needs.dependency-update-check.result }}",
                    "short": true
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      continue-on-error: true
