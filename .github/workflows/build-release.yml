name: Maven Release Pipeline

on:
  workflow_dispatch: # Disparo manual
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para tags

      # 2. Configurar JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # 3. Configurar Git
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # 4. Configurar Maven settings.xml
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # 5. Preparar release
      - name: Prepare Release
        run: |
          mvn --batch-mode release:prepare \
            -DreleaseVersion=${{ github.ref_name }} \
            -DdevelopmentVersion=${{ github.ref_name }}-SNAPSHOT \
            -Dtag=release-${{ github.ref_name }}

      # 6. Executar release
      - name: Perform Release
        run: mvn --batch-mode release:perform -Pprod
