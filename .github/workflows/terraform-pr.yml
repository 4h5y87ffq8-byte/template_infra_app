name: Terraform PR Validation

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-pr.yml'

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  terraform-check:
    name: Terraform Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format Check
      working-directory: ./infra
      run: terraform fmt -check -recursive
      continue-on-error: true

    - name: Terraform Init
      working-directory: ./infra
      run: terraform init

    - name: Terraform Validate
      working-directory: ./infra
      run: terraform validate

    - name: Terraform Plan (Dev)
      working-directory: ./infra
      run: |
        terraform plan \
          -var-file=environments/dev.tfvars \
          -no-color \
          -out=tfplan-dev
      continue-on-error: true

    - name: Save plan output
      working-directory: ./infra
      if: always()
      run: |
        terraform show -no-color tfplan-dev > tfplan-dev.txt
      continue-on-error: true

    - name: Comment PR with Plan
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('./infra/tfplan-dev.txt', 'utf8');
          const maxLength = 65000; // GitHub comment limit
          const planOutput = plan.length > maxLength 
            ? plan.substring(0, maxLength) + '\n... (truncated)'
            : plan;
          
          const output = `#### Terraform Plan 📝
          
          <details><summary>Show Plan</summary>
          
          \`\`\`terraform
          ${planOutput}
          \`\`\`
          
          </details>
          
          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });

    - name: Check for destroy operations
      working-directory: ./infra
      run: |
        if grep -q "destroy" tfplan-dev.txt; then
          echo "⚠️ WARNING: Plan contains destroy operations!"
          exit 1
        fi
      continue-on-error: true

    - name: Security scan with tfsec
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: ./infra
        soft_fail: true

    - name: Upload plan artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: terraform-plan
        path: infra/tfplan-dev.txt
        retention-days: 5
